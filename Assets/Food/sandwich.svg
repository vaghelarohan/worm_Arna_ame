<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="breadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Drop Shadow -->
  <ellipse cx="48" cy="80" rx="36" ry="10" fill="rgba(0,0,0,0.25)"/>
  <!-- Bottom Bread Triangle -->
  <path d="M12 68 L84 68 L48 18 Z" fill="url(#breadGrad)" stroke="#78350f" stroke-width="3" stroke-linejoin="round"/>
  <!-- Ham Slice -->
  <polygon points="16,66 80,66 48,22" fill="#f43f5e" stroke="#be123c" stroke-width="2"/>
  <!-- Cheese Slice (peeking out) -->
  <polygon points="12,65 86,60 48,20" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <!-- Crisp Lettuce (ruffled edge) -->
  <path d="M14 62 Q22 56 30 62 Q38 56 46 62 Q54 56 62 62 Q70 56 78 62 L82 66 L12 66 Z" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <!-- Tomato Slice -->
  <circle cx="36" cy="48" r="9" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
  <circle cx="58" cy="48" r="9" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
  <!-- Top Bread Slice with crust edge -->
  <path d="M16 60 L80 60 L48 16 Z" fill="url(#breadGrad)" stroke="#78350f" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Crust Highlight & Texture -->
  <path d="M26 54 L48 24 L70 54" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Toasted seeds -->
  <circle cx="48" cy="42" r="1.8" fill="#fef08a"/>
  <circle cx="40" cy="48" r="1.8" fill="#fef08a"/>
  <circle cx="56" cy="48" r="1.8" fill="#fef08a"/>
</svg>

