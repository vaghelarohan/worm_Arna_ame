<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="champShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#050814" flood-opacity="0.6"/>
    </filter>

    <linearGradient id="cGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="20%" stop-color="#f59e0b"/>
      <stop offset="45%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="wreathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <g filter="url(#champShadow)">
    <!-- Laurel Wreath behind Cup -->
    <!-- Left Branch -->
    <path d="M 26,82 C 14,64 16,36 32,20 C 31,28 32,36 38,44 C 28,52 26,68 36,80 Z"
          fill="url(#wreathGrad)" stroke="#78350f" stroke-width="1.5" opacity="0.9"/>
    <!-- Right Branch -->
    <path d="M 102,82 C 114,64 112,36 96,20 C 97,28 96,36 90,44 C 100,52 102,68 92,80 Z"
          fill="url(#wreathGrad)" stroke="#78350f" stroke-width="1.5" opacity="0.9"/>

    <!-- Left Handle -->
    <path d="M 40,34 C 18,34 16,62 36,70 C 34,62 33,46 44,42 Z"
          fill="url(#cGoldGrad)" stroke="#78350f" stroke-width="2.5"/>
    <path d="M 37,38 C 26,39 22,58 34,65"
          fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Right Handle -->
    <path d="M 88,34 C 110,34 112,62 92,70 C 94,62 95,46 84,42 Z"
          fill="url(#cGoldGrad)" stroke="#78350f" stroke-width="2.5"/>
    <path d="M 91,38 C 102,39 106,58 94,65"
          fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Pedestal Base -->
    <path d="M 30,114 L 98,114 L 94,122 L 34,122 Z" fill="#0f172a" stroke="#020617" stroke-width="2"/>
    <rect x="36" y="94" width="56" height="20" rx="3" fill="#1e293b" stroke="#090d16" stroke-width="2"/>
    <rect x="44" y="98" width="40" height="11" rx="2" fill="url(#cGoldGrad)" stroke="#78350f" stroke-width="1.2"/>
    <text x="64" y="106.5" font-family="sans-serif" font-weight="900" font-size="7.5" fill="#78350f" text-anchor="middle">#1</text>

    <!-- Stem -->
    <path d="M 55,74 L 73,74 L 70,94 L 58,94 Z" fill="url(#cGoldGrad)" stroke="#78350f" stroke-width="2"/>
    <ellipse cx="64" cy="84" rx="10" ry="3" fill="#fef08a" stroke="#78350f" stroke-width="1.5"/>

    <!-- Main Trophy Cup -->
    <path d="M 36,24 C 36,24 34,68 64,74 C 94,68 92,24 92,24 Z"
          fill="url(#cGoldGrad)" stroke="#78350f" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="64" cy="24" rx="28" ry="7" fill="#f59e0b" stroke="#78350f" stroke-width="2.5"/>
    <ellipse cx="64" cy="24" rx="25" ry="5" fill="#78350f"/>

    <!-- #1 Star Medal -->
    <circle cx="64" cy="48" r="14" fill="#d97706" stroke="#fef08a" stroke-width="2"/>
    <path d="M 64,38 L 66.5,44 L 73,44.5 L 68,48.5 L 70,55 L 64,51.5 L 58,55 L 60,48.5 L 55,44.5 L 61.5,44 Z"
          fill="#fef08a"/>

    <!-- Specular Highlight -->
    <path d="M 42,29 C 40,43 47,61 58,67"
          fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
    <circle cx="42" cy="30" r="3" fill="#ffffff"/>
  </g>
</svg>

