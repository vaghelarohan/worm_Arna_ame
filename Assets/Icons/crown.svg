<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Soft royal drop shadow -->
    <filter id="crownShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#070918" flood-opacity="0.6"/>
    </filter>

    <!-- Royal Gold Gradient -->
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="15%" stop-color="#f59e0b"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Ruby Gem Gradient -->
    <radialGradient id="rubyGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fecdd3"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="85%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>

    <!-- Sapphire Gem Gradient -->
    <radialGradient id="sapphireGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="85%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>

    <!-- Emerald Gem Gradient -->
    <radialGradient id="emeraldGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="40%" stop-color="#16a34a"/>
      <stop offset="85%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </radialGradient>

    <!-- Pearl Gradient -->
    <radialGradient id="pearlGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
  </defs>

  <g filter="url(#crownShadow)">
    <!-- Crown Main Body with 5 Peaks -->
    <path d="M 16,92 
             L 12,42 
             L 38,62 
             L 64,26 
             L 90,62 
             L 116,42 
             L 112,92 
             Z"
          fill="url(#crownGold)" stroke="#78350f" stroke-width="3" stroke-linejoin="round"/>

    <!-- Inside Arch Shadow -->
    <path d="M 20,90 C 44,82 84,82 108,90 L 112,92 C 84,80 44,80 16,92 Z"
          fill="#451a03" opacity="0.6"/>

    <!-- Bottom Crown Band -->
    <rect x="14" y="92" width="100" height="18" rx="6"
          fill="url(#crownGold)" stroke="#78350f" stroke-width="2.5"/>

    <!-- Bottom Band Beaded Rim -->
    <rect x="18" y="106" width="92" height="3" rx="1.5" fill="#fef08a" opacity="0.8"/>
    <rect x="18" y="93.5" width="92" height="2" rx="1" fill="#78350f" opacity="0.4"/>

    <!-- Jewels along Crown Band -->
    <!-- Center Sapphire (Large Oval) -->
    <ellipse cx="64" cy="101" rx="7" ry="5.5" fill="url(#sapphireGrad)" stroke="#fef08a" stroke-width="1.2"/>
    <circle cx="62" cy="99" r="1.5" fill="#ffffff" opacity="0.9"/>

    <!-- Left Ruby (Square Diamond) -->
    <polygon points="40,96 45,101 40,106 35,101" fill="url(#rubyGrad)" stroke="#fef08a" stroke-width="1"/>
    <circle cx="39" cy="99.5" r="1" fill="#ffffff"/>

    <!-- Right Ruby (Square Diamond) -->
    <polygon points="88,96 93,101 88,106 83,101" fill="url(#rubyGrad)" stroke="#fef08a" stroke-width="1"/>
    <circle cx="87" cy="99.5" r="1" fill="#ffffff"/>

    <!-- Leftmost Emerald -->
    <circle cx="23" cy="101" r="3.8" fill="url(#emeraldGrad)" stroke="#fef08a" stroke-width="1"/>
    <circle cx="22" cy="99.5" r="1" fill="#ffffff"/>

    <!-- Rightmost Emerald -->
    <circle cx="105" cy="101" r="3.8" fill="url(#emeraldGrad)" stroke="#fef08a" stroke-width="1"/>
    <circle cx="104" cy="99.5" r="1" fill="#ffffff"/>

    <!-- Pearls / Orbs on Peak Tips -->
    <!-- Left outer peak pearl -->
    <circle cx="12" cy="40" r="6" fill="url(#pearlGrad)" stroke="#78350f" stroke-width="1.8"/>
    <circle cx="10" cy="38" r="2" fill="#ffffff"/>

    <!-- Left inner peak pearl -->
    <circle cx="38" cy="60" r="5" fill="url(#pearlGrad)" stroke="#78350f" stroke-width="1.8"/>
    <circle cx="36.5" cy="58.5" r="1.5" fill="#ffffff"/>

    <!-- Center Peak Royal Ruby Orb (Largest) -->
    <circle cx="64" cy="24" r="8" fill="url(#rubyGrad)" stroke="#fef08a" stroke-width="2"/>
    <circle cx="61.5" cy="21.5" r="2.5" fill="#ffffff"/>
    <!-- Cross on top of center orb -->
    <path d="M 64,10 L 64,16 M 61,13 L 67,13" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right inner peak pearl -->
    <circle cx="90" cy="60" r="5" fill="url(#pearlGrad)" stroke="#78350f" stroke-width="1.8"/>
    <circle cx="88.5" cy="58.5" r="1.5" fill="#ffffff"/>

    <!-- Right outer peak pearl -->
    <circle cx="116" cy="40" r="6" fill="url(#pearlGrad)" stroke="#78350f" stroke-width="1.8"/>
    <circle cx="114" cy="38" r="2" fill="#ffffff"/>

    <!-- Specular Highlight Lines -->
    <path d="M 18,88 L 15,48 L 36,64 L 61,31"
          fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    
    <!-- Sparkles -->
    <polygon points="64,48 65.5,52 70,53 65.5,54 64,58 62.5,54 58,53 62.5,52" fill="#ffffff"/>
    <polygon points="30,70 31,73 34,74 31,75 30,78 29,75 26,74 29,73" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
