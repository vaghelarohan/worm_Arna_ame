<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background outer glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Primary Cyan to Deep Sapphire Gradient -->
    <linearGradient id="infGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>

    <!-- Bevel & 3D Shading Gradient -->
    <linearGradient id="tubeShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Shadow under cross -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#021427" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind -->
  <path d="M 64,64 C 48,42 22,42 16,64 C 10,86 36,86 64,64 C 92,42 118,42 112,64 C 106,86 80,86 64,64 Z"
        fill="none" stroke="#00f5ff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.25" filter="url(#glow)"/>

  <!-- Dark Base Outline / Depth Rim -->
  <path d="M 64,64 C 48,42 22,42 16,64 C 10,86 36,86 64,64 C 92,42 118,42 112,64 C 106,86 80,86 64,64 Z"
        fill="none" stroke="#082f49" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main Glowing 3D Tube -->
  <path d="M 64,64 C 48,42 22,42 16,64 C 10,86 36,86 64,64 C 92,42 118,42 112,64 C 106,86 80,86 64,64 Z"
        fill="none" stroke="url(#infGrad)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3D Bevel and Volume Overlay -->
  <path d="M 64,64 C 48,42 22,42 16,64 C 10,86 36,86 64,64 C 92,42 118,42 112,64 C 106,86 80,86 64,64 Z"
        fill="none" stroke="url(#tubeShade)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top Gloss Specular Highlight Line -->
  <path d="M 62,60 C 47,40 25,41 20,58"
        fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 108,58 C 103,41 81,40 66,60"
        fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Outer Loop Rim Glints -->
  <path d="M 12,64 C 12,76 22,81 34,79"
        fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 116,64 C 116,76 106,81 94,79"
        fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Center Cross Overlap Shadow & Bridge to create real 3D overlap -->
  <path d="M 54,74 C 59,70 64,64 69,59"
        fill="none" stroke="#041e33" stroke-width="19" stroke-linecap="round" opacity="0.7"/>
  <path d="M 53,74 C 58,69 64,64 70,58"
        fill="none" stroke="url(#infGrad)" stroke-width="16" stroke-linecap="round"/>
  <path d="M 53,74 C 58,69 64,64 70,58"
        fill="none" stroke="url(#tubeShade)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 55,71 L 68,58"
        fill="none" stroke="#ffffff" stroke-width="4.0" stroke-linecap="round" opacity="0.85"/>

  <!-- Sparkle Crystals -->
  <circle cx="21" cy="56" r="2.5" fill="#ffffff"/>
  <circle cx="107" cy="56" r="2.5" fill="#ffffff"/>
  <circle cx="64" cy="64" r="2.0" fill="#ffffff" opacity="0.9"/>
</svg>
