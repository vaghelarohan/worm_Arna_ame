<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="magGlow" cx="48" cy="48" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="60%" stop-color="rgba(250, 204, 21, 0)"/>
      <stop offset="90%" stop-color="rgba(250, 204, 21, 0.45)"/>
      <stop offset="100%" stop-color="rgba(250, 204, 21, 0.9)"/>
    </radialGradient>
    <linearGradient id="redArm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="blueArm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="silverTip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <!-- Floor aura ring -->
  <circle cx="48" cy="48" r="42" fill="none" stroke="#facc15" stroke-width="4" stroke-opacity="0.85"/>
  <circle cx="48" cy="48" r="42" fill="url(#magGlow)"/>
  <!-- Horseshoe U-shape: Left arm Red, Right arm Blue -->
  <path d="M22 52 L22 36 C22 22 34 14 48 14 C48 14 48 28 48 28 C42 28 36 32 36 38 L36 52 Z" fill="url(#redArm)" stroke="#7f1d1d" stroke-width="2.5"/>
  <path d="M74 52 L74 36 C74 22 62 14 48 14 C48 14 48 28 48 28 C54 28 60 32 60 38 L60 52 Z" fill="url(#blueArm)" stroke="#172554" stroke-width="2.5"/>
  <!-- Silver Tips -->
  <rect x="22" y="52" width="14" height="16" rx="3" fill="url(#silverTip)" stroke="#334155" stroke-width="2.5"/>
  <rect x="60" y="52" width="14" height="16" rx="3" fill="url(#silverTip)" stroke="#334155" stroke-width="2.5"/>
  <!-- Magnetic Field Sparks -->
  <path d="M29 76 C29 84 67 84 67 76" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4" stroke-linecap="round"/>
  <!-- Highlight -->
  <path d="M26 36 C26 26 36 18 48 18" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round"/>
