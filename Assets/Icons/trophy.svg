<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Soft warm drop shadow -->
    <filter id="trophyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#050814" flood-opacity="0.6"/>
    </filter>

    <!-- Golden Cup Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="20%" stop-color="#f59e0b"/>
      <stop offset="45%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Handle Highlight Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Pedestal Metallic Base Gradient -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="65%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="plaqueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <g filter="url(#trophyShadow)">
    <!-- Side Handles -->
    <!-- Left Handle -->
    <path d="M 40,32 C 16,32 14,64 36,72 C 34,64 32,46 44,40 Z"
          fill="url(#handleGrad)" stroke="#78350f" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 37,36 C 24,37 20,60 34,67"
          fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Right Handle -->
    <path d="M 88,32 C 112,32 114,64 92,72 C 94,64 96,46 84,40 Z"
          fill="url(#handleGrad)" stroke="#78350f" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 91,36 C 104,37 108,60 94,67"
          fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Pedestal Base Lower Tier -->
    <path d="M 28,114 L 100,114 L 96,122 L 32,122 Z"
          fill="#0f172a" stroke="#020617" stroke-width="2"/>
    <rect x="28" y="112" width="72" height="3" fill="#64748b" rx="1.5"/>

    <!-- Pedestal Block (Dark Marble / Obsidian) -->
    <path d="M 34,92 L 94,92 L 90,112 L 38,112 Z"
          fill="url(#baseGrad)" stroke="#090d16" stroke-width="2"/>
    
    <!-- Gold Plaque on Pedestal -->
    <rect x="46" y="97" width="36" height="10" rx="2.5" fill="url(#plaqueGrad)" stroke="#78350f" stroke-width="1.2"/>
    <circle cx="49" cy="102" r="1.2" fill="#78350f"/>
    <circle cx="79" cy="102" r="1.2" fill="#78350f"/>
    <rect x="53" y="100.5" width="22" height="3" rx="1.5" fill="#78350f" opacity="0.65"/>

    <!-- Stem / Golden Column -->
    <path d="M 54,74 L 74,74 L 71,92 L 57,92 Z"
          fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
    <!-- Stem Ring -->
    <ellipse cx="64" cy="84" rx="11" ry="3.5" fill="#fef08a" stroke="#92400e" stroke-width="1.5"/>

    <!-- Main Cup Body -->
    <path d="M 34,22 C 34,22 32,68 64,74 C 96,68 94,22 94,22 Z"
          fill="url(#goldGrad)" stroke="#78350f" stroke-width="3" stroke-linejoin="round"/>

    <!-- Cup Rim Oval -->
    <ellipse cx="64" cy="22" rx="30" ry="7.5" fill="#f59e0b" stroke="#78350f" stroke-width="2.5"/>
    <ellipse cx="64" cy="22" rx="27" ry="5.5" fill="#78350f"/>
    <ellipse cx="64" cy="23" rx="25" ry="4" fill="#92400e"/>

    <!-- Star Emblem on Cup -->
    <path d="M 64,36 L 66.5,43 L 74,43.5 L 68,48 L 70.5,55 L 64,51 L 57.5,55 L 60,48 L 54,43.5 L 61.5,43 Z"
          fill="#fef08a" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="64" cy="46" r="2" fill="#ffffff"/>

    <!-- Specular Gloss Arc / Light Reflections -->
    <path d="M 40,28 C 38,44 46,62 58,68"
          fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 43,26 L 47,26"
          stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="64" cy="18" rx="16" ry="2.5" fill="#ffffff" opacity="0.6"/>

    <!-- Shiny Star Glints -->
    <polygon points="40,24 42,28 46,30 42,32 40,36 38,32 34,30 38,28" fill="#ffffff"/>
    <circle cx="40" cy="30" r="1.5" fill="#fef08a"/>
    <polygon points="86,30 87,33 90,34 87,35 86,38 85,35 82,34 85,33" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
